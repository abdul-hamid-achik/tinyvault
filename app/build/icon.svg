<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none" role="img" aria-label="TinyVault">
  <defs>
    <linearGradient id="plate" x1="512" y1="0" x2="512" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B261D"/>
      <stop offset="1" stop-color="#15110C"/>
    </linearGradient>
    <linearGradient id="gold" x1="176" y1="176" x2="848" y2="848" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFC861"/>
      <stop offset="1" stop-color="#E8920C"/>
    </linearGradient>
  </defs>

  <!-- macOS-style rounded plate; radius ≈22.5% of the edge. Corners stay
       transparent: the Dock and Finder composite the icon over whatever is
       behind it, so flattening them to any colour reads as a white box. -->
  <rect width="1024" height="1024" rx="230" fill="url(#plate)"/>

  <!--
    The vault-door mark from docs/public/logo.svg with unchanged geometry but a
    heavier stroke (3.4 vs the web logo's 3): at Dock and Finder sizes the thin
    weight dissolves. Scaled from the 48x48 box to 672px and centred.
  -->
  <g transform="translate(176 176) scale(14)" stroke-width="3.4">
    <rect x="5.5" y="7.5" width="37" height="33" rx="6.5" stroke="url(#gold)" stroke-width="3.4"/>
    <circle cx="23" cy="24" r="8.5" stroke="url(#gold)" stroke-width="3.4"/>
    <circle cx="23" cy="24" r="2.6" fill="url(#gold)"/>
    <g stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round">
      <path d="M23 15.5 V11.5"/>
      <path d="M23 36.5 V32.5"/>
      <path d="M31.5 24 H35.5"/>
      <path d="M14.5 24 H10.5"/>
    </g>
    <path d="M37 24 H40.5" stroke="url(#gold)" stroke-width="3.4" stroke-linecap="round"/>
  </g>
</svg>
