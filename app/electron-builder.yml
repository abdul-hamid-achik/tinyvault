# electron-builder config.
#
# The app is UNSIGNED and UNNOTARIZED: `identity: null` on macOS is deliberate
# (there is no Developer ID certificate in this project), so a downloaded bundle
# trips Gatekeeper on first launch. That is documented in docs/guide/desktop.md
# and in the release notes — do not remove those warnings when touching this file.
#
# `bun run package` passes --dir, which ignores the targets below and produces an
# unpacked app for local use. CI (release-app.yml) builds the real artifacts.
#
# Output goes to release/, NOT dist/: dist/ at the repo root already belongs to
# GoReleaser and the root .gitignore claims it.

appId: dev.tinyvault.desktop
productName: TinyVault
copyright: Copyright © 2026 abdulachik

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  - "!**/*.map"

# The Go binary is NOT bundled into the asar. The app resolves `tvault` at
# runtime (settings → TVAULT_BIN → npm platform package → PATH), which keeps the
# bundle small and lets it track whatever tvault the user has installed.
asar: true

# Stable, platform-explicit names: the release page lists these beside the CLI
# archives, so a reader must be able to tell arm64 from x64 at a glance.
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.developer-tools
  # dmg only. A zip of the same unsigned bundle would double the release size
  # (~130 MB each) without giving the user anything the dmg does not: mount,
  # drag to /Applications, then clear quarantine.
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Unsigned by design; a signed release would need Developer ID + notarization.
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  category: Development
  # AppImage only: one file that runs anywhere, and the CLI release already
  # ships .deb/.rpm/.apk for people who prefer a package manager.
  target:
    - target: AppImage
      arch:
        - x64
        - arm64

win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
  # No Authenticode certificate in this project, so SmartScreen will warn.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

npmRebuild: false
